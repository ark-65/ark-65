name: Daily Self Commit

on:
  schedule:
    - cron: "5 0 * * *"  # 每天 00:05 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-self-commit
  cancel-in-progress: true

jobs:
  commit:
    # 避免机器人自己推送再次触发循环
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    name: Commit heartbeat to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git author
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -e
          git config user.name "$REPOSITORY_OWNER"
          git config user.email "${REPOSITORY_OWNER_ID}+${REPOSITORY_OWNER}@users.noreply.github.com"

      - name: Update README with zodiac tips
        env:
          HORO_TZ: ${{ vars.HORO_TZ }}
        run: |
          set -e
          python3 .github/scripts/update_readme_horo.py

          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: daily horoscope tips update $(date -u '+%Y-%m-%d')"

      - name: Push changes
        if: success()
        run: |
          set -e
          git pull --rebase origin main || true
          git push origin HEAD:main
